[build]
builder = "nixpacks"

[deploy]
startCommand = "alembic upgrade head && python -c \"from app.core.database import SessionLocal; from app.models.models import User, UserRole, RegistrationStatus; from app.core.security import get_password_hash; from datetime import datetime; db = SessionLocal(); existing = db.query(User).filter(User.email == 'admin@ju18alumni.org').first(); db.add(User(email='admin@ju18alumni.org', password_hash=get_password_hash('Admin@2026'), role=UserRole.SUPER_ADMIN, registration_status=RegistrationStatus.APPROVED, created_at=datetime.utcnow())) if not existing else None; db.commit(); db.close(); print('Admin OK!')\" && uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
