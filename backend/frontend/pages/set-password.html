<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Password — JU 18th Batch Alumni</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --navy: #1a3a5c; --gold: #c9a84c; --light: #f4f7fb; --white: #fff; --text: #2c3e50; --muted: #6c7a89; --error: #e74c3c; --success: #27ae60; --border: #dde3ea; --radius: 8px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Sans 3', sans-serif; background: var(--light); min-height: 100vh; display: flex; flex-direction: column; }
.header { background: var(--navy); padding: 16px 24px; }
.logo-text h1 { font-family: 'Merriweather', serif; color: var(--white); font-size: 18px; }
.logo-text p { color: var(--gold); font-size: 12px; }
.main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.box { background: var(--white); border-radius: 12px; padding: 48px 40px; box-shadow: 0 2px 24px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
.icon { text-align: center; font-size: 40px; margin-bottom: 8px; }
.title { font-family: 'Merriweather', serif; font-size: 22px; color: var(--navy); text-align: center; margin-bottom: 6px; }
.sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text); }
.field input { padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: var(--navy); }
.strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
.strength-fill { height: 100%; transition: all 0.3s; border-radius: 2px; width: 0; }
.strength-text { font-size: 11px; margin-top: 3px; }
.btn { width: 100%; padding: 13px; background: var(--navy); color: var(--white); border: none; border-radius: var(--radius); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
.btn:hover { background: #122840; }
.btn:disabled { background: var(--muted); cursor: not-allowed; }
.alert { padding: 12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; display: none; }
.alert.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; display: block; }
.alert.success { background: #eafaf1; color: var(--success); border: 1px solid #c3e6cb; display: block; }
.invalid-box { text-align: center; padding: 32px 16px; display: none; }
.invalid-box .icon { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>
<header class="header">
    <div class="logo-text"><h1>JU 18th Batch</h1><p>Alumni Association</p></div>
</header>

<main class="main">
    <div class="box">
        <!-- Invalid token screen -->
        <div class="invalid-box" id="invalid-box">
            <div class="icon">❌</div>
            <div class="title" style="font-size:18px">Invalid or Expired Link</div>
            <p style="color:var(--muted);margin-top:12px;font-size:14px">This password setup link is invalid or has expired. Please contact the admin.</p>
        </div>

        <!-- Set password form -->
        <div id="set-form">
            <div class="icon">🔐</div>
            <h2 class="title">Set Your Password</h2>
            <p class="sub">Choose a strong password to secure your account</p>

            <div id="alert" class="alert"></div>

            <div class="field">
                <label>New Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" oninput="checkStrength(this.value)">
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <div class="strength-text" id="strength-text"></div>
            </div>

            <div class="field">
                <label>Confirm Password</label>
                <input type="password" id="confirm" placeholder="Repeat your password">
            </div>

            <button class="btn" id="btn" onclick="setPassword()">Set Password & Login</button>
        </div>
    </div>
</main>

<script>
var API_BASE = 'https://ju18-alumni-production.up.railway.app';
var token = new URLSearchParams(window.location.search).get('token');

if (!token) {
    document.getElementById('set-form').style.display = 'none';
    document.getElementById('invalid-box').style.display = 'block';
}

function checkStrength(val) {
    var fill = document.getElementById('strength-fill');
    var text = document.getElementById('strength-text');
    if (!val) { fill.style.width = '0'; text.textContent = ''; return; }
    var score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    var colors = ['#e74c3c','#e67e22','#f1c40f','#27ae60','#1abc9c'];
    var labels = ['Very Weak','Weak','Fair','Strong','Very Strong'];
    fill.style.width = (score * 20) + '%';
    fill.style.background = colors[score-1] || '#e74c3c';
    text.textContent = labels[score-1] || '';
    text.style.color = colors[score-1] || '#e74c3c';
}

function setPassword() {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;
    var alertEl = document.getElementById('alert');
    var btn = document.getElementById('btn');

    if (!password || password.length < 6) {
        alertEl.className = 'alert error';
        alertEl.textContent = 'Password must be at least 6 characters.';
        return;
    }
    if (password !== confirm) {
        alertEl.className = 'alert error';
        alertEl.textContent = 'Passwords do not match.';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Setting password...';
    alertEl.className = 'alert';

    fetch(API_BASE + '/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: password })
    })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
    .then(function(result) {
        if (result.ok) {
            alertEl.className = 'alert success';
            alertEl.textContent = '✅ Password set! Redirecting to login...';
            setTimeout(function() {
                window.location.href = API_BASE + '/pages/login.html';
            }, 2000);
        } else {
            alertEl.className = 'alert error';
            alertEl.textContent = result.data.detail || 'Failed. Link may have expired.';
            btn.disabled = false;
            btn.textContent = 'Set Password & Login';
            if (result.data.detail && result.data.detail.includes('expired')) {
                document.getElementById('set-form').style.display = 'none';
                document.getElementById('invalid-box').style.display = 'block';
            }
        }
    })
    .catch(function() {
        alertEl.className = 'alert error';
        alertEl.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Set Password & Login';
    });
}
</script>
</body>
</html>
