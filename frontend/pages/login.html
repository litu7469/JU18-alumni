<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — JU 18th Batch Alumni</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --navy: #1a3a5c; --gold: #c9a84c; --light: #f4f7fb; --white: #fff; --text: #2c3e50; --muted: #6c7a89; --error: #e74c3c; --success: #27ae60; --border: #dde3ea; --radius: 8px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Sans 3', sans-serif; background: var(--light); min-height: 100vh; display: flex; flex-direction: column; }
.header { background: var(--navy); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.header-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo-text h1 { font-family: 'Merriweather', serif; color: var(--white); font-size: 18px; }
.logo-text p { color: var(--gold); font-size: 12px; }
.back-link { color: var(--gold); text-decoration: none; font-size: 14px; }

.main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.login-box { background: var(--white); border-radius: 12px; padding: 48px 40px; box-shadow: 0 2px 24px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
.login-icon { text-align: center; margin-bottom: 8px; font-size: 40px; }
.login-title { font-family: 'Merriweather', serif; font-size: 24px; color: var(--navy); text-align: center; margin-bottom: 6px; }
.login-sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text); }
.field input { padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: var(--navy); }
.field-row { display: flex; justify-content: space-between; align-items: center; }
.field-row label { font-size: 13px; font-weight: 600; color: var(--text); }
.forgot-link { font-size: 12px; color: var(--navy); text-decoration: none; }
.forgot-link:hover { text-decoration: underline; }

.btn-login { width: 100%; padding: 13px; background: var(--navy); color: var(--white); border: none; border-radius: var(--radius); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
.btn-login:hover { background: #122840; }
.btn-login:disabled { background: var(--muted); cursor: not-allowed; }

.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider span { font-size: 12px; color: var(--muted); }

.register-link { text-align: center; font-size: 14px; color: var(--muted); }
.register-link a { color: var(--navy); font-weight: 600; text-decoration: none; }
.register-link a:hover { text-decoration: underline; }

.alert { padding: 12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; display: none; }
.alert.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; display: block; }
.alert.success { background: #eafaf1; color: var(--success); border: 1px solid #c3e6cb; display: block; }

.verified-banner { background: #eafaf1; border: 1px solid #c3e6cb; color: var(--success); padding: 12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; text-align: center; display: none; }
</style>
</head>
<body>
<header class="header">
    <a href="/index.html" class="header-logo">
        <div class="logo-text">
            <h1>JU 18th Batch</h1>
            <p>Alumni Association</p>
        </div>
    </a>
    <a href="/pages/register.html" class="back-link">New here? Register →</a>
</header>

<main class="main">
    <div class="login-box">
        <div class="login-icon">🎓</div>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-sub">Sign in to your alumni account</p>

        <div id="verified-banner" class="verified-banner">✅ Email verified successfully! You can now login.</div>
        <div id="alert" class="alert"></div>

        <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')login()">
        </div>

        <div class="field">
            <div class="field-row">
                <label>Password</label>
                <a href="/pages/forgot-password.html" class="forgot-link">Forgot password?</a>
            </div>
            <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()">
        </div>

        <button class="btn-login" id="login-btn" onclick="login()">Login</button>

        <div class="divider"><span>or</span></div>
        <div class="register-link">Don't have an account? <a href="/pages/register.html">Register now</a></div>
    </div>
</main>

<script>
const API_BASE = '';

// Check if just verified
const params = new URLSearchParams(window.location.search);
if (params.get('verified') === 'true') {
    document.getElementById('verified-banner').style.display = 'block';
}

// Redirect if already logged in
if (localStorage.getItem('access_token')) {
    window.location.href = '/pages/dashboard.html';
}

async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const alert = document.getElementById('alert');

    if (!email || !password) {
        alert.className = 'alert error';
        alert.textContent = 'Please enter your email and password.';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    alert.className = 'alert';

    try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('refresh_token', data.refresh_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            // Redirect based on status
            if (data.user.role === 'admin' || data.user.role === 'super_admin') {
                window.location.href = '/admin/dashboard.html';
            } else if (data.user.registration_status === 'approved') {
                window.location.href = '/pages/dashboard.html';
            } else {
                window.location.href = '/pages/pending.html';
            }
        } else {
            alert.className = 'alert error';
            alert.textContent = data.detail || 'Login failed. Please check your credentials.';
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    } catch (e) {
        alert.className = 'alert error';
        alert.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Login';
    }
}
</script>
</body>
</html>
