<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — JU 18th Batch Alumni</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f4f7fb; min-height: 100vh; display: flex; flex-direction: column; }
  .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .header img { width: 48px; height: 48px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 12px; opacity: 0.8; }
  .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 420px; }
  .icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
  h2 { color: #1a3a5c; font-size: 22px; margin-bottom: 8px; text-align: center; }
  .subtitle { color: #7f8c8d; font-size: 14px; text-align: center; margin-bottom: 28px; line-height: 1.5; }
  label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; padding: 12px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; margin-bottom: 20px; }
  input:focus { border-color: #1a3a5c; }
  .btn { width: 100%; padding: 13px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  .btn:hover { background: #2a5298; }
  .btn:disabled { background: #95a5a6; cursor: not-allowed; }
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
  .alert.success { background: #eafaf1; color: #27ae60; border: 1px solid #a9dfbf; }
  .alert.error { background: #fdecea; color: #e74c3c; border: 1px solid #f5c6c2; }
  .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: #7f8c8d; }
  .back-link a { color: #1a3a5c; text-decoration: none; font-weight: 600; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="header">
  <img src="https://ju18-alumni-production.up.railway.app/assets/images/ju-logo.png" alt="JU Logo">
  <div>
    <h1>JU 18th Batch Alumni</h1>
    <p>Jahangirnagar University Alumni Association</p>
  </div>
</div>
<div class="container">
  <div class="card">
    <div class="icon">🔑</div>
    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter your registered email address and we'll send you a link to reset your password.</p>
    <div class="alert" id="alert"></div>
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="your@email.com" onkeydown="if(event.key==='Enter') sendReset()">
    <button class="btn" id="btn" onclick="sendReset()">Send Reset Link</button>
    <div class="back-link"><a href="https://ju18-alumni-production.up.railway.app/pages/login.html">← Back to Login</a></div>
  </div>
</div>
<script>
const API_BASE = 'https://ju18-alumni-production.up.railway.app';

async function sendReset() {
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('btn');
    const alertEl = document.getElementById('alert');
    alertEl.style.display = 'none';

    if (!email) {
        alertEl.className = 'alert error';
        alertEl.textContent = 'Please enter your email address.';
        alertEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        alertEl.className = 'alert success';
        alertEl.textContent = '✅ ' + (data.message || 'Reset link sent! Check your email inbox.');
        alertEl.style.display = 'block';
        document.getElementById('email').value = '';
    } catch (e) {
        alertEl.className = 'alert error';
        alertEl.textContent = '❌ Something went wrong. Please try again.';
        alertEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
    }
}
</script>
</body>
</html>
